name: NeverBounce check
on:
  schedule:
    - cron: '0 6 * * *'     # every day 06:00 UTC (06:00 UK in winter, 07:00 in summer, before 09:00); the days that actually check are chosen in Atlas > Contacts > Settings
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even on a day that is not chosen or after 09:00 UK (1 = yes)'
        required: false
        default: '0'
      push_only:
        description: 'Only push contacts that already passed to HubSpot, no new checks (1 = yes)'
        required: false
        default: '0'

concurrency: neverbounce

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Verify the contacts a person approved
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          NEVERBOUNCE_API_KEY: ${{ secrets.NEVERBOUNCE_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ATLAS_WEBHOOK_URL: ${{ secrets.SLACK_ATLAS_WEBHOOK_URL }}
          SLACK_ATLAS_CHANNEL: ${{ vars.SLACK_ATLAS_CHANNEL }}
          NB_FORCE: ${{ inputs.force }}
          NB_PUSH_ONLY: ${{ inputs.push_only }}
        run: python -m src.neverbounce
