name: NeverBounce weekly check
on:
  schedule:
    - cron: '0 6 * * 1'     # Mondays 06:00 UTC: 06:00 UK in winter, 07:00 in summer, always before 09:00
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even outside Monday before 09:00 UK (1 = yes)'
        required: false
        default: '0'

concurrency: neverbounce

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Verify the contacts a person approved
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          NEVERBOUNCE_API_KEY: ${{ secrets.NEVERBOUNCE_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ATLAS_WEBHOOK_URL: ${{ secrets.SLACK_ATLAS_WEBHOOK_URL }}
          SLACK_ATLAS_CHANNEL: ${{ vars.SLACK_ATLAS_CHANNEL }}
          NB_FORCE: ${{ inputs.force }}
        run: python -m src.neverbounce
