name: ODS probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, collections, concurrent.futures as cf
          B = "https://directory.spineservices.nhs.uk/ORD/2-0-0"
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={"Accept": "application/json"}), timeout=60) as r: return json.load(r)
          out, off = {}, 0
          while True:
              p = {"PrimaryRoleId": "RO96", "Status": "Active", "Limit": 500}
              if off: p["Offset"] = off
              orgs = get(B + "/organisations?" + urllib.parse.urlencode(p)).get("Organisations", [])
              before = len(out)
              for o in orgs: out[o["OrgId"]] = o
              print("page offset", off, "got", len(orgs), "total", len(out))
              if len(orgs) < 500 or len(out) == before: break
              off = len(out)
          print("ACTIVE RO96 BRANCHES:", len(out))
          print("sample", [(o["OrgId"], o["Name"], o["PostCode"]) for o in list(out.values())[:5]])
          print("code lengths", collections.Counter(len(c) for c in out))
          codes = list(out)[:60]
          def parent(c):
              d = get(B + "/organisations/" + c).get("Organisation", {})
              rels = [(r.get("id"), r.get("Status"), r["Target"]["PrimaryRoleId"]["id"], r["Target"]["OrgId"]["extension"]) for r in (d.get("Rels") or {}).get("Rel", [])]
              ops = [x.get("Start") for x in d.get("Date", []) if x.get("Type") == "Operational"]
              tel = [x.get("value") for x in (d.get("Contacts") or {}).get("Contact", []) if x.get("type") == "tel"]
              return c, rels, ops, tel
          with cf.ThreadPoolExecutor(8) as ex: res = list(ex.map(parent, codes))
          kinds = collections.Counter()
          for c, rels, ops, tel in res:
              gp = [r for r in rels if r[2] == "RO177" and r[1] == "Active"]
              kinds[(len(gp), tuple(sorted({r[0] for r in gp})))] += 1
          print("active RO177 parent count/rel ids across 60 sampled:", dict(kinds))
          print("with phone:", sum(1 for r in res if r[3]), "with start:", sum(1 for r in res if r[2]))
          print("examples", res[:3])
          json.dump(sorted(out), open("/tmp/codes.json", "w"))
          print("ALL CODES", ",".join(sorted(out))[:200])
          PY
