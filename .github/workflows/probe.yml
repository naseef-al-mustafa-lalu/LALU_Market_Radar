name: Probe token scopes (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read the scopes of the sync token (read-only; the token is never printed)
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok = os.environ["HUBSPOT_TOKEN"]
          def call(method, url, body=None):
              req = urllib.request.Request(url, method=method, data=json.dumps(body).encode() if body else None, headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
          s, d = call("POST", "https://api.hubapi.com/oauth/v2/private-apps/get/access-token-info", {"tokenKey": tok})
          print("token info:", s, json.dumps(d)[:1500] if not isinstance(d, str) else d)
          for name, url in [("line_items", "https://api.hubapi.com/crm/v3/objects/line_items?limit=1&properties=quantity,hs_product_id"), ("owners", "https://api.hubapi.com/crm/v3/owners?limit=1"), ("company props", "https://api.hubapi.com/crm/v3/properties/companies/org_type")]:
              s, d = call("GET", url)
              print(name, s, (json.dumps(d)[:200] if not isinstance(d, str) else d))
          PY
