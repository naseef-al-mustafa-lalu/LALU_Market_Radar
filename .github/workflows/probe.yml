name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ODS NI (RO315) and Isle of Man (RO177, IM postcodes) (read-only)
        run: |
          python3 - <<'PY'
          import requests, time
          B = "https://directory.spineservices.nhs.uk/ORD/2-0-0/organisations"
          H = {"Accept": "application/json"}
          def page_all(role, extra=None):
              out, offset = {}, 0
              while True:
                  p = {"PrimaryRoleId": role, "Status": "Active", "Limit": 500}
                  if extra: p.update(extra)
                  if offset: p["Offset"] = offset
                  orgs = requests.get(B, params=p, headers=H, timeout=60).json().get("Organisations", [])
                  before = len(out)
                  for o in orgs: out[o["OrgId"]] = o
                  if len(orgs) < 500 or len(out) == before: break
                  offset = len(out)
              return out
          ni = page_all("RO315")
          print("NI RO315 active:", len(ni))
          for o in list(ni.values())[:6]: print(" ", o["OrgId"], "|", o["Name"], "|", o.get("PostCode"))
          print("NI codes range:", min(ni), max(ni), "first letters:", sorted({k[0] for k in ni}))
          gp = page_all("RO177")
          print("RO177 active (no RO76 filter):", len(gp))
          im = {k: o for k, o in gp.items() if str(o.get("PostCode", "")).upper().startswith("IM")}
          print("Isle of Man (IM postcode):", len(im))
          for k, o in sorted(im.items()): print(" ", k, "|", o["Name"], "|", o.get("PostCode"))
          other = {k: o for k, o in gp.items() if k[0] in "YZ" and k not in im}
          print("Y/Z RO177 not IM:", len(other), "e.g.", [(k, o["Name"][:24], o.get("PostCode")) for k, o in list(other.items())[:5]])
          PY
