name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ODS and OpenDataNI (read-only)
        run: |
          set +e
          for c in Z00001 Y00001 W00001 Z00100 A81634; do echo "== ODS $c"; curl -s -m 30 "https://directory.spineservices.nhs.uk/ORD/2-0-0/organisations/$c" | head -c 700; echo; done
          echo "== ODS roles for NI/IoM search (Status active, PrimaryRoleId RO177 prescribing cost centre)"; curl -s -m 30 "https://directory.spineservices.nhs.uk/ORD/2-0-0/organisations?Name=Harland&Status=Active&Limit=5" | head -c 700; echo
          echo "== OpenDataNI package"; curl -s -m 30 "https://admin.opendatani.gov.uk/api/3/action/package_show?id=gp-practice-list-sizes" | head -c 2500; echo
          echo "== opendatani host"; curl -sI -m 30 https://admin.opendatani.gov.uk/ | head -5
