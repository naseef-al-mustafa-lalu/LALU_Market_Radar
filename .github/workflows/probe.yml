name: Probe unknown ODS codes (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look the unmatched HubSpot codes up in ODS (read-only; prints ODS codes and their public status only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import collections, json, os, urllib.request
          base, key = os.environ["SUPABASE_URL"], os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, None
              except Exception as e:
                  return 0, None
          st, rows = get(f"{base}/rest/v1/hubspot_audit?select=ods_code,issue&issue=in.(unknown_code,unknown_wales)&limit=2000", {"apikey": key, "Authorization": "Bearer " + key})
          codes = sorted({r["ods_code"] for r in rows})
          print("codes to look up:", len(codes))
          cat = collections.defaultdict(list)
          for c in codes:
              s, d = get(f"https://directory.spineservices.nhs.uk/ORD/2-0-0/organisations/{c}")
              if s == 404 or not d:
                  cat["not found in ODS (typo or never existed)" if s == 404 else f"lookup failed ({s})"].append(c); continue
              o = d.get("Organisation", {})
              roles = o.get("Roles", {}).get("Role", [])
              prim = next((r.get("id") for r in roles if r.get("primaryRole")), None)
              dates = o.get("Date", [])
              end = next((x.get("End") for x in dates if x.get("Type") == "Operational" and x.get("End")), "")
              succ = [r.get("Target", {}).get("OrgId", {}).get("extension") for rel in [o.get("Rels", {}).get("Rel", [])] for r in rel if r.get("id") == "RE5" or "uccess" in str(r.get("id"))]
              kind = {"RO177": "prescribing cost centre / practice", "RO76": "GP practice"}.get(prim, f"other role {prim}")
              label = f"{o.get('Status')} | {kind}"
              cat[label].append((c, (end or "")[:4], len(succ)))
          for k, v in sorted(cat.items(), key=lambda x: -len(x[1])):
              print(f"\n{k}: {len(v)}")
              if v and isinstance(v[0], tuple):
                  yrs = collections.Counter(x[1] or "?" for x in v)
                  print("  closed year:", dict(sorted(yrs.items())))
                  print("  with a successor listed:", sum(1 for x in v if x[2]))
                  print("  sample:", [x[0] for x in v[:12]])
              else:
                  print("  codes:", v[:30])
          PY
