name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: HubSpot sequences and lists access (read-only)
        env:
          T: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, requests
          H = {"Authorization": "Bearer " + os.environ["T"]}
          B = "https://api.hubapi.com"
          def g(path, **kw):
              r = requests.get(B + path, headers=H, timeout=40, **kw)
              try: j = r.json()
              except Exception: j = r.text[:80].replace("\n", " ")
              return r.status_code, j
          names = ["hs_sequences_is_enrolled", "hs_sequences_actively_enrolled_count", "hs_sequences_enrolled_count", "hs_latest_sequence_enrolled", "hs_latest_sequence_enrolled_date", "hs_latest_sequence_ended_date",
                   "hs_sales_email_last_replied", "hs_sales_email_last_opened", "hs_sales_email_last_clicked", "hs_email_last_send_date", "engagements_last_meeting_booked", "hs_email_optout", "hs_email_bad_address", "hs_email_last_reply_date"]
          for n in names:
              sc, j = g("/crm/v3/properties/contacts/" + n)
              print("prop", n, sc, (j.get("label") if isinstance(j, dict) else j))
          sc, c = g("/crm/v3/objects/contacts", params={"limit": 1})
          cid = c["results"][0]["id"] if isinstance(c, dict) and c.get("results") else None
          print("sample contact", sc, bool(cid))
          for path in ("/automation/v4/sequences/enrollments/contacts/%s" % cid, "/automation/v4/sequences/enrollments/contact/%s" % cid, "/automation/v4/sequences/%s/enrollments" % "553071802",
                       "/automation/v4/sequences/enrollments", "/automation/v4/sequences/553071802"):
              sc, j = g(path, params={"userId": 38848375})
              print("GET", path.replace(str(cid), "{id}"), sc, (list(j.keys()) if isinstance(j, dict) else j))
          sc, j = g("/automation/v4/sequences/553071802", params={"userId": 38848375})
          if isinstance(j, dict): print("sequence detail", {k: (v if not isinstance(v, (list, dict)) else type(v).__name__) for k, v in j.items()})
          PY
