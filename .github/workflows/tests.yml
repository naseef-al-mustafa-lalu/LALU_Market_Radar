name: Tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  dashboard:
    # builds the stylesheet (it must match what is committed) and drives the real page in a browser against a fake Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build:css
      - name: Committed stylesheet is up to date
        run: git diff --exit-code assets/tailwind.css || (echo "assets/tailwind.css is stale: run 'npm run build:css' and commit it" && exit 1)
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python tests/dashboard_smoke.py
        env: { SHOT_DIR: '${{ runner.temp }}' }
