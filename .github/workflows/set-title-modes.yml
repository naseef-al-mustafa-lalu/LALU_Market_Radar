name: Set job titles to Main
on:
  workflow_dispatch:
    inputs:
      titles:
        description: 'Job titles to set to Main, separated by semicolons'
        required: true
        default: 'Business Partner;Practice Business Partner;Managing Business Partner'

jobs:
  titles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Set the titles to Main and recalculate contact status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TITLES: ${{ inputs.titles }}
        run: python -m src.set_title_modes
