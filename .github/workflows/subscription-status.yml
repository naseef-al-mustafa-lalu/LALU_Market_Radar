name: Read Marketing Information subscription status (read-only)
on:
  workflow_dispatch:
    inputs:
      list_id:
        description: 'HubSpot list (segment) id'
        required: true
        default: '5017'

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Read the Marketing Information status for Atlas-eligible people
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIST_ID: ${{ inputs.list_id }}
        run: python -m src.subscription_status
