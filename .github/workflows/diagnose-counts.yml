name: Diagnose counts
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Practice name to show (part of the name)'
        required: false
        default: 'Sunderland GP Alliance'

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Count practices by HubSpot state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAME: ${{ inputs.name }}
        run: python -m src.diagnose_counts
