name: Add a group or federation
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Member list (a JSON file under data/networks)'
        required: false
        default: 'data/networks/conexus.json'
      apply:
        description: 'Create it in HubSpot and link the practices (1 = yes; 0 = only show the plan)'
        required: false
        default: '0'

concurrency: add-network

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Plan or create the network
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          NETWORK_FILE: ${{ inputs.file }}
          APPLY: ${{ inputs.apply }}
        run: python -m src.add_network
