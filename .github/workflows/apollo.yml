name: Apollo lookup
on:
  schedule:
    - cron: '20 * * * *'   # hourly, check mode only: approved contacts are checked (and emails already in your Apollo contacts pulled) with no credits; enrich is only ever started by hand
  workflow_dispatch:
    inputs:
      cap:
        description: 'Most contacts to look up this run (each address found costs Apollo credits)'
        required: false
        default: '100'
      waterfall:
        description: 'enrich mode only: when the standard lookup has no email, also try Apollo waterfall enrichment (extra email sources; some vendors charge per lookup even when nothing is found). 1 = yes'
        required: false
        default: '0'
      only:
        description: 'Only this person (part of the full name), for a test: nobody else is looked up or paid for'
        required: false
        default: ''
      mode:
        description: 'check = only verify approved contacts exist at Apollo at their practice (no credits); enrich = verify, then look up the email of each verified one (uses credits); none = only refresh the coverage counts'
        required: false
        default: 'check'

concurrency: apollo

jobs:
  apollo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Look up the approved contacts and refresh coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          APOLLO_CAP: ${{ inputs.cap || 200 }}
          APOLLO_MODE: ${{ inputs.mode || 'check' }}
          APOLLO_ONLY: ${{ inputs.only }}
          APOLLO_WATERFALL: ${{ inputs.waterfall }}
        run: python -m src.apollo
