name: Opt Oscar and Apollo contacts into Marketing Information
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the opt-ins to HubSpot (1) or only count what would change (0)'
        required: true
        default: '0'
      sources:
        description: 'Which contacts: apollo, or oscar,apollo (Oscar is on hold)'
        required: true
        default: 'apollo'
      scope:
        description: 'created = Oscar contacts only if Atlas created them in HubSpot; all = every Oscar contact'
        required: true
        default: 'created'

      rewrite:
        description: 'Also rewrite the old consent wording on contacts Atlas opted in (1 = yes; only exact old text is touched)'
        required: true
        default: '0'

jobs:
  optin:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency: hubspot-sync
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Opt in the contacts Atlas added to HubSpot (opt-outs are left alone)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          APPLY: ${{ inputs.apply }}
          OPTIN_SOURCES: ${{ inputs.sources }}
          OPTIN_SCOPE: ${{ inputs.scope }}
          OPTIN_REWRITE: ${{ inputs.rewrite }}
        run: python -m src.marketing_optin
