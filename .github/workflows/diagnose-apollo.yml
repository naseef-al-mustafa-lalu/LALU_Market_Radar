name: Diagnose Apollo
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Full name to look up'
        required: true
        default: 'Shahana Uddin'
      ods:
        description: 'Practice ODS code to compare with'
        required: true
        default: 'Y03023'

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Search Apollo (no credits) and compare with the practice
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          NAME: ${{ inputs.name }}
          ODS: ${{ inputs.ods }}
        run: python -m src.diagnose_apollo
