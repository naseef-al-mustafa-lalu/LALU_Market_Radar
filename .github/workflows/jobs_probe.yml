name: Jobs feed probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://www.jobs.nhs.uk/api/v1/search_xml"
          echo "== with the pipeline's header"; curl -sS -m 90 -D - -o /tmp/a.xml -A "LaluMarketRadar/1.0 (+daily read of the public NHS Jobs feed)" "$U?limit=100&page=1&sort=publicationDateDesc" ; head -c 600 /tmp/a.xml; echo
          echo "== plain browser UA"; curl -sS -m 90 -D - -o /tmp/b.xml -A "Mozilla/5.0" "$U?limit=100&page=1&sort=publicationDateDesc"; head -c 600 /tmp/b.xml; echo
          echo "== no sort param"; curl -sS -m 90 -D - -o /tmp/c.xml -A "Mozilla/5.0" "$U?limit=10&page=1"; head -c 600 /tmp/c.xml; echo
