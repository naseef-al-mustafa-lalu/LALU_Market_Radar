name: Daily market radar
on:
  schedule:
    - cron: '30 7 * * *'   # 07:30 UTC daily
  workflow_dispatch:

concurrency: radar-pipeline

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Ingest NHS + Oscar data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OSCAR_API_URL: ${{ secrets.OSCAR_API_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          CQC_API_KEY: ${{ secrets.CQC_API_KEY }}
        run: python -m src.ingest
      - name: Post new signals to Slack
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}      # only with a bot token; a webhook is tied to its channel (#lalu_market_radar)
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          SLACK_MODE: ${{ vars.SLACK_MODE || 'ON' }}    # ON or DISABLED
          MIN_TIER_ALERT: ${{ vars.MIN_TIER_ALERT || 'Tier 3' }}  # Tier 1..5 (1 = 20,000+ patients, 3 = 10,000+, 5 = all)
        run: python -m src.notify
