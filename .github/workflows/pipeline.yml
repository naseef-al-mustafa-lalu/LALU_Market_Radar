name: Daily market radar
on:
  schedule:
    - cron: '30 7 * * *'   # 07:30 UTC daily
  workflow_dispatch:

concurrency: radar-pipeline

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Ingest NHS + Oscar data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OSCAR_API_URL: ${{ secrets.OSCAR_API_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
          GP_REG_URL: ${{ vars.GP_REG_URL }}   # optional manual override of the NHS patient-count file link
        run: python -m src.ingest
      - name: Send digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
          EMAIL_MODE: ${{ vars.EMAIL_MODE || 'DIGEST' }}          # DIGEST or DISABLED
          MIN_TIER_ALERT: ${{ vars.MIN_TIER_ALERT || 'Tier 2' }}  # Tier 1 | Tier 2 | Tier 3
        run: python -m src.digest
