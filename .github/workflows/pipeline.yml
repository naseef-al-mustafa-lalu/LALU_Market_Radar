name: Daily market radar
on:
  schedule:
    - cron: '30 7 * * *'   # 07:30 UTC daily
  workflow_dispatch:

concurrency: radar-pipeline

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Ingest NHS + Oscar data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OSCAR_API_URL: ${{ secrets.OSCAR_API_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CQC_API_KEY: ${{ secrets.CQC_API_KEY }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
          DIGEST_FROM: ${{ vars.DIGEST_FROM }}
        run: python -m src.ingest
      - name: Send digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
          DIGEST_FROM: ${{ vars.DIGEST_FROM }}
          EMAIL_MODE: ${{ vars.EMAIL_MODE || 'DIGEST' }}          # DIGEST or DISABLED
          MIN_TIER_ALERT: ${{ vars.MIN_TIER_ALERT || 'Tier 3' }}  # Tier 1..5 (1 = 20,000+ patients, 3 = 10,000+, 5 = all)
        run: python -m src.digest
