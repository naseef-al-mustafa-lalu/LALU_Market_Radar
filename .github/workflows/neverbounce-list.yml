name: NeverBounce a list of HubSpot contacts
on:
  workflow_dispatch:
    inputs:
      records:
        description: 'One contact per line: HubSpot record id,email'
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Verify the addresses and write NeverBounce Status to HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          NEVERBOUNCE_API_KEY: ${{ secrets.NEVERBOUNCE_API_KEY }}
          RECORDS: ${{ inputs.records }}
        run: python -m src.neverbounce_list
