name: Fix Apollo contact attribution
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'HubSpot contact ids, separated by commas'
        required: true
        default: '267421022431,267365176539,932902046942,679346262240'
      apply:
        description: 'Write the changes (1) or only print them (0)'
        required: true
        default: '1'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Make the attribution agree
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          IDS: ${{ inputs.ids }}
          APPLY: ${{ inputs.apply }}
        run: python -m src.fix_apollo_attribution
