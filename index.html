<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Lalu Market Radar</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

<!-- Login -->
<section id="login" class="hidden min-h-screen flex items-center justify-center p-6">
  <form id="login-form" class="bg-white border border-slate-200 rounded-xl p-8 w-full max-w-sm space-y-4 shadow-sm">
    <h1 class="text-xl font-bold">Lalu Market Radar</h1>
    <p class="text-sm text-slate-500">Sign in with your Lalu account.</p>
    <input id="email" type="email" required autocomplete="username" placeholder="Email" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
    <input id="password" type="password" required autocomplete="current-password" placeholder="Password" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 text-sm font-semibold">Sign in</button>
    <p id="login-error" class="text-sm text-rose-600 min-h-[1.25rem]"></p>
  </form>
</section>

<!-- App -->
<div id="app" class="hidden">
  <nav class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between">
    <span class="text-lg font-bold">Lalu Market Radar</span>
    <div class="flex items-center gap-4 text-sm text-slate-500">
      <span id="refresh-badge">Loading…</span>
      <button id="signout" class="text-blue-600 hover:underline">Sign out</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    <aside class="bg-white rounded-xl border border-slate-200 p-5 h-fit">
      <h2 class="font-bold mb-3">Latest signals <span id="live-dot" class="ml-2 text-[11px] font-semibold text-slate-400">connecting…</span></h2>
      <div id="alerts" class="space-y-3 max-h-[600px] overflow-y-auto"><p class="text-sm italic text-slate-400">No signals yet.</p></div>
    </aside>

    <section class="lg:col-span-2 bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div class="p-5 border-b border-slate-200 space-y-3">
        <div class="flex flex-wrap gap-2 items-center">
          <input id="f-search" placeholder="Search practice, ODS, PCN, contact…" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm flex-1 min-w-[200px]">
          <select id="f-tier" class="border border-slate-300 rounded-lg px-2 py-1.5 text-sm"><option value="">All tiers</option><option>Tier 1</option><option>Tier 2</option><option>Tier 3</option></select>
          <select id="f-sw" class="border border-slate-300 rounded-lg px-2 py-1.5 text-sm"><option value="">Any system</option><option>EMIS Web</option><option>SystmOne</option><option>Vision</option><option>Unknown</option></select>
          <select id="f-lead" class="border border-slate-300 rounded-lg px-2 py-1.5 text-sm"><option value="">Any status</option><option>Cold</option><option>In-Progress</option><option>Contacted</option><option>Do-Not-Contact</option></select>
          <select id="f-icb" class="border border-slate-300 rounded-lg px-2 py-1.5 text-sm max-w-[200px]"><option value="">All ICBs</option></select>
        </div>
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2"><input id="f-sig" type="checkbox"> Only practices with recent signals</label>
          <span><span id="count" class="text-slate-500"></span>
            <button id="btn-export" class="ml-3 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-semibold">Export CSV</button></span>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 text-xs uppercase tracking-wider text-slate-600"><tr>
            <th class="p-3">Practice</th><th class="p-3">Network</th><th class="p-3 text-right">Patients</th><th class="p-3">Key contact</th></tr></thead>
          <tbody id="rows" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
      <div class="p-4 text-center"><button id="more" class="hidden text-blue-600 hover:underline text-sm">Show more</button></div>
    </section>
  </main>
</div>

<script>
const SUPABASE_URL = "https://qvdnpvouqecfsinsvvwf.supabase.co";
const SUPABASE_KEY = "sb_publishable_LpkAFZSZ977KX590OHJcXw_MMhtKxUy"; // publishable key: safe to expose, access is enforced by RLS
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const PAGE = 100;
let practices = [], filtered = [], shown = 0, signalCodes = new Set(), channel = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tier = p => (p.sales_segment || "").slice(0, 6);

/* ---------- auth ---------- */
async function boot() {
  const { data: { session } } = await db.auth.getSession();
  session ? startApp() : showLogin();
}
function showLogin() { $("app").classList.add("hidden"); $("login").classList.remove("hidden"); }
$("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  $("login-error").textContent = "";
  const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) { $("login-error").textContent = "Sign-in failed. Check your email and password."; return; }
  $("password").value = "";
  startApp();
});
$("signout").addEventListener("click", async () => {
  if (channel) { db.removeChannel(channel); channel = null; }
  practices = []; filtered = [];
  await db.auth.signOut();
  showLogin();
});

/* ---------- data ---------- */
async function fetchAll(table, columns, order) {
  const out = [];
  for (let from = 0; ; from += 1000) {            // PostgREST caps responses at 1000 rows
    const { data, error } = await db.from(table).select(columns).order(order).range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) return out;
  }
}
async function startApp() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  try {
    practices = await fetchAll("gp_practices", "*", "ods_code");
    if (!practices.length) { $("rows").innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-400 italic">No data yet, or your account is not authorised.</td></tr>'; }
    const icbs = [...new Set(practices.map(p => p.icb_name))].sort();
    $("f-icb").innerHTML = '<option value="">All ICBs</option>' + icbs.map(i => `<option>${esc(i)}</option>`).join("");
    const { data: sigs } = await db.from("sales_triggers").select("*").order("detected_at", { ascending: false }).limit(300);
    signalCodes = new Set((sigs || []).map(s => s.ods_code));
    $("alerts").innerHTML = ""; (sigs || []).slice(0, 30).reverse().forEach(addAlert);
    if (!(sigs || []).length) $("alerts").innerHTML = '<p class="text-sm italic text-slate-400">No signals yet.</p>';
    const { data: run } = await db.from("ingest_runs").select("finished_at,stats").eq("status", "success").order("id", { ascending: false }).limit(1);
    $("refresh-badge").textContent = run && run[0] ? `Data refreshed ${new Date(run[0].finished_at).toLocaleDateString("en-GB")} (NHS data month ${run[0].stats.data_month || "?"})` : "No successful refresh yet";
    applyFilters();
    channel = db.channel("signals").on("postgres_changes", { event: "INSERT", schema: "public", table: "sales_triggers" }, p => { signalCodes.add(p.new.ods_code); addAlert(p.new); })
      .subscribe(s => { $("live-dot").textContent = s === "SUBSCRIBED" ? "● live" : "offline"; });
  } catch (err) { $("refresh-badge").textContent = "Failed to load data: " + (err.message || err); }
}

/* ---------- alerts ---------- */
function addAlert(a) {
  const rail = $("alerts");
  if (rail.querySelector("p")) rail.innerHTML = "";
  const hot = a.trigger_type === "MERGER_DETECTED" || a.trigger_type === "NEW_PRACTICE";
  const el = document.createElement("div");
  el.className = `p-3 border-l-4 rounded-r-lg ${hot ? "border-purple-600 bg-purple-50" : "border-blue-600 bg-blue-50"}`;
  el.innerHTML = `<div class="flex justify-between text-[10px] font-bold uppercase tracking-wider"><span>${esc(a.trigger_type.replaceAll("_", " "))}</span><span class="font-mono text-slate-400">${esc(new Date(a.detected_at).toLocaleDateString("en-GB"))}</span></div>
    <div class="text-xs font-bold mt-1">${esc(a.headline)} <span class="font-mono text-slate-400">${esc(a.ods_code)}</span></div>
    <p class="text-[11px] text-slate-600 mt-0.5">${esc(a.description)}</p>`;
  el.style.cursor = "pointer";
  el.onclick = () => { $("f-search").value = a.ods_code; applyFilters(); };
  rail.prepend(el);
}

/* ---------- table ---------- */
function applyFilters() {
  const q = $("f-search").value.trim().toLowerCase(), t = $("f-tier").value, sw = $("f-sw").value,
        lead = $("f-lead").value, icb = $("f-icb").value, sig = $("f-sig").checked;
  filtered = practices.filter(p =>
    p.status === "Active" && (!t || tier(p) === t) && (!sw || p.clinical_software === sw) && (!lead || p.lead_status === lead) &&
    (!icb || p.icb_name === icb) && (!sig || signalCodes.has(p.ods_code)) &&
    (!q || [p.practice_name, p.ods_code, p.pcn_name, p.manager_name, p.postcode].some(v => (v || "").toLowerCase().includes(q))))
    .sort((a, b) => b.total_patients - a.total_patients);
  shown = 0; $("rows").innerHTML = ""; renderMore();
  $("count").textContent = `${filtered.length.toLocaleString()} practices`;
}
function renderMore() {
  const slice = filtered.slice(shown, shown + PAGE); shown += slice.length;
  const frag = document.createDocumentFragment();
  for (const p of slice) {
    const tr = document.createElement("tr");
    tr.className = "hover:bg-slate-50 cursor-pointer align-top";
    const email = p.manager_email ? (p.manager_email_opt_out ? '<span class="text-rose-600">email opt-out</span>' : esc(p.manager_email)) : "";
    tr.innerHTML = `<td class="p-3"><div class="font-semibold">${esc(p.practice_name)}</div><div class="text-[11px] font-mono text-slate-400">${esc(p.ods_code)} · ${esc(tier(p))} · ${esc(p.clinical_software)}${signalCodes.has(p.ods_code) ? ' · <span class="text-purple-700 font-semibold">signal</span>' : ""}</div></td>
      <td class="p-3"><div>${esc(p.pcn_name)}</div><div class="text-xs text-slate-400">${esc(p.icb_name)}</div></td>
      <td class="p-3 text-right font-mono">${p.total_patients.toLocaleString()}</td>
      <td class="p-3"><div class="font-medium">${p.manager_name ? esc(p.manager_name) : '<span class="italic text-amber-600">No contact</span>'}</div><div class="text-xs text-slate-500">${esc(p.manager_title)}</div><div class="text-xs text-slate-400">${email}</div><div class="text-[11px] text-blue-600 font-mono">${esc(p.manager_phone)}</div></td>`;
    tr.onclick = () => toggleDetail(tr, p);
    frag.appendChild(tr);
  }
  $("rows").appendChild(frag);
  $("more").classList.toggle("hidden", shown >= filtered.length);
  if (!filtered.length) $("rows").innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-400 italic">No practices match these filters.</td></tr>';
}
async function toggleDetail(tr, p) {
  if (tr.nextSibling && tr.nextSibling.dataset && tr.nextSibling.dataset.detail === p.ods_code) { tr.nextSibling.remove(); return; }
  const d = document.createElement("tr"); d.dataset.detail = p.ods_code;
  d.innerHTML = '<td colspan="4" class="p-4 bg-slate-50 text-sm">Loading…</td>';
  tr.after(d);
  const { data: cs, error } = await db.from("contacts").select("*").eq("ods_code", p.ods_code).order("is_primary", { ascending: false });
  const opts = ["Cold", "In-Progress", "Contacted", "Do-Not-Contact"].map(s => `<option ${s === p.lead_status ? "selected" : ""}>${s}</option>`).join("");
  d.firstChild.innerHTML = `<div class="flex items-center gap-3 mb-3"><span class="font-semibold">Lead status</span><select class="border border-slate-300 rounded px-2 py-1">${opts}</select><span class="text-xs text-slate-400"></span></div>` +
    (error ? "Could not load contacts." : (cs || []).map(c => `<div class="py-1 border-t border-slate-200"><b>${esc(c.full_name)}</b>${c.is_primary ? " ★" : ""} · ${esc(c.job_title)}<br><span class="text-xs text-slate-500">${c.email ? (c.email_opt_out ? "email opt-out" : esc(c.email)) : ""} ${esc(c.phone)}</span></div>`).join("") || "No contacts on file.");
  const sel = d.querySelector("select"), note = d.querySelector("span.text-xs");
  sel.onchange = async () => {
    const { error: e } = await db.from("gp_practices").update({ lead_status: sel.value }).eq("ods_code", p.ods_code);
    if (e) { note.textContent = "Save failed"; sel.value = p.lead_status; } else { p.lead_status = sel.value; note.textContent = "Saved"; }
  };
}

/* ---------- export ---------- */
const csvCell = v => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replaceAll('"', '""') + '"'; };
$("btn-export").addEventListener("click", () => {
  const rows = filtered.filter(p => p.lead_status !== "Do-Not-Contact");   // never export do-not-contact leads
  const head = ["ODS Code", "Practice", "PCN", "ICB", "Patients", "Segment", "Clinical System", "Contact", "Job Title", "Email", "Phone", "Lead Status"];
  const lines = rows.map(p => [p.ods_code, p.practice_name, p.pcn_name, p.icb_name, p.total_patients, p.sales_segment, p.clinical_software,
    p.manager_name, p.manager_title, p.manager_email_opt_out ? "" : p.manager_email, p.manager_phone, p.lead_status].map(csvCell).join(","));
  const blob = new Blob(["﻿" + head.map(csvCell).join(",") + "\r\n" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Lalu_Leads_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
});

["f-search", "f-tier", "f-sw", "f-lead", "f-icb", "f-sig"].forEach(id => $(id).addEventListener(id === "f-search" ? "input" : "change", applyFilters));
$("more").addEventListener("click", renderMore);
boot();
</script>
</body>
</html>
